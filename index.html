<!DOCTYPE html>

<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>2048</h1>

<div class="top-bar">

    <div class="score-box">
        SCORE
        <span id="score">0</span>
    </div>

    <button id="undo">
        戻す
    </button>

    <button id="restart">
        リスタート
    </button>

</div>


<!-- 追加：2の出現ルール -->
<div class="mode-box">

    <div class="mode-title">
        2の出現ルール
    </div>

    <div class="mode-buttons">

        <button id="validOnlyMode" class="mode-button active">
    通常モード
</button>

<button id="everyMoveMode" class="mode-button">
    2の強制追加
</button>

    </div>

</div>


<div id="board"></div>

</div>

<script src="script.js"></script>

</body>

</html>
